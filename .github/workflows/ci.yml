name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  check:
    name: Validate website
    runs-on: ubuntu-latest
    env:
      ARGOS_API_URL: https://api.example.test/api
      NEXT_PUBLIC_ARGOS_API_URL: https://api.example.test/api
      NEXT_PUBLIC_SITE_URL: https://example.test
      STUDIO_ARGOS_API_KEY: ci-blog-admin-api-key
      STUDIO_PASSWORD_HASH: scrypt:ci-salt:GGp03_CxrK_udF3Hk_SoGBXB7i1a9TccbmpPi9Fp5ZEUZUbLNqHf7fZLCibf642XtkU6D9zcRsiAWpMN-6_4qA
      STUDIO_SESSION_SECRET: ci-session-secret-at-least-32-characters
      STUDIO_USERNAME: studio-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test --runInBand

      - name: Install browser for end-to-end tests
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm run test:e2e:docker

      - name: Browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Dependency audit
        run: pnpm audit --audit-level=moderate
